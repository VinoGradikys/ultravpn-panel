<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="description" content="UltraVPN — административная панель">
<title>UltraVPN · Админ-панель</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#0b0b0e; --surface:#141419; --surface2:#1b1b22; --surface3:#22222b;
  --line:#2a2a33; --line2:#383843;
  --text:#f5f5f7; --muted:#9a9aa5; --muted2:#6f6f7a;
  --red:#e5484d; --red2:#ff5c61; --red-dark:#b2363a;
  --green:#34d399; --amber:#fbbf24; --blue:#60a5fa;
  --radius:18px; --radius-sm:12px;
  --shadow:0 18px 60px rgba(0,0,0,.42);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(229,72,77,.18),transparent 60%),var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:390px;background:linear-gradient(180deg,var(--surface),#101015);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}
.logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--red2),var(--red-dark));box-shadow:0 10px 30px rgba(229,72,77,.35);flex:0 0 auto}
.logo svg{width:27px;height:27px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45}
.field{margin-top:14px}
.field label{display:block;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;transition:.15s}
.input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.16)}
textarea{resize:vertical;min-height:72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:9px 13px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--surface3)}
.btn.primary{background:linear-gradient(135deg,var(--red2),var(--red-dark));border-color:transparent;box-shadow:0 8px 22px rgba(229,72,77,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#ffb4b6;border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.1)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 9px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.icon{width:17px;height:17px;display:inline-block;vertical-align:-3px}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 60px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px;flex-wrap:wrap}
header.top h1{font-size:17px}
header.top .sub{font-size:11.5px}
.spacer{flex:1}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;overflow:auto;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.tab.active{background:rgba(229,72,77,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(229,72,77,.3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:11.5px}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:360px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--surface),#111116);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 10px 34px rgba(0,0,0,.18)}
.card.offline{opacity:.82}
.card-head{display:flex;gap:11px;align-items:flex-start}
.card-title{font-weight:700;font-size:15px;line-height:1.25;word-break:break-word}
.card-sub{color:var(--muted);font-size:11.5px;margin-top:3px;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.badge.green{color:#8ff0c9;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.09)}
.badge.red{color:#ffb4b6;border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.1)}
.badge.amber{color:#ffe08a;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.09)}
.badge.blue{color:#b7d5ff;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.09)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
.kv div{min-width:0}
.kv span{display:block;color:var(--muted2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kv b{font-size:12.5px;font-weight:600;word-break:break-word}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.section{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#101015;overflow:hidden}
.section-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.02em}
.section-head .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(229,72,77,.12)}
.section-body{padding:12px}
.section-body .kv{margin-top:0}
.identity{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.identity .wide{grid-column:1/-1}
.identity span{display:block;color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.identity b{font-size:12px;font-weight:600;word-break:break-word}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:11.5px;user-select:none}
pre{white-space:pre-wrap;word-break:break-word;background:#0a0a0d;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0;max-height:260px;overflow:auto;font-size:11px;color:#c9c9d2}
.provider{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.provider .input{flex:1;min-width:0;padding:8px 9px;font-size:12px}
.empty{padding:44px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#22222b;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:13px;max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:90;padding:0}
.modal{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:20px;box-shadow:var(--shadow)}
@media(min-width:640px){.modal-back{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h2{font-size:17px;margin:0 0 4px}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px}
.check input{width:auto;accent-color:var(--red)}
.hint{color:var(--muted2);font-size:11px;line-height:1.5;margin-top:6px}
@media(max-width:720px){
  .wrap{padding:12px 12px 50px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  header.top h1{font-size:15px}
  .login-card{padding:22px}
}
</style>
</head>
<body>

<div class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 3.2 27 7v8.6c0 6.4-4.4 10.9-11 13.2C9.4 26.5 5 22 5 15.6V7l11-3.8Z" fill="#fff"/><path d="M12 10.5v6.2c0 2.6 1.7 4.2 4 4.2s4-1.6 4-4.2v-6.2" stroke="#E5484D" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
    <h1 style="margin-top:18px">UltraVPN</h1>
    <div class="sub">Административная панель. Вход только для администраторов.</div>
    <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Пароль</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
    <div style="margin-top:18px"><button class="btn primary block" id="loginBtn" type="submit">Войти</button></div>
    <div class="hint" id="loginError" style="color:#ffb4b6"></div>
  </form>
</div>

<div class="wrap hidden" id="appView">
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 3.2 27 7v8.6c0 6.4-4.4 10.9-11 13.2C9.4 26.5 5 22 5 15.6V7l11-3.8Z" fill="#fff"/><path d="M12 10.5v6.2c0 2.6 1.7 4.2 4 4.2s4-1.6 4-4.2v-6.2" stroke="#E5484D" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
    <div><h1>UltraVPN</h1><div class="sub" id="whoami">—</div></div>
    <div class="spacer"></div>
    <button class="btn small" id="refreshBtn" type="button">Обновить</button>
    <button class="btn small ghost" id="logoutBtn" type="button">Выйти</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="devices" type="button">Устройства</button>
    <button class="tab" data-tab="users" type="button">Пользователи</button>
    <button class="tab" data-tab="feedback" type="button">Обращения</button>
    <button class="tab" data-tab="events" type="button">События</button>
  </nav>

  <div class="stats" id="stats">
    <div class="stat"><b id="statDevices">—</b><span>устройств</span></div>
    <div class="stat"><b id="statOnline">—</b><span>онлайн</span></div>
    <div class="stat"><b id="statUsers">—</b><span>пользователей</span></div>
    <div class="stat"><b id="statFeedback">—</b><span>новых обращений</span></div>
  </div>

  <div class="toolbar">
    <input class="input search" id="search" placeholder="Поиск по имени, HWID, пользователю…">
    <button class="btn primary hidden" id="createUserBtn" type="button">+ Пользователь</button>
  </div>

  <div id="view"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
var SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
var SUPABASE_ANON_KEY = 'PASTE_ANON_KEY';
var PANEL_FUNCTION = SUPABASE_URL + '/functions/v1/panel';
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var state = {
  email: '',
  tab: 'devices',
  search: '',
  devices: [],
  users: [],
  feedback: [],
  events: [],
  commands: [],
  loading: false,
  realtime: null
};

function $(id) { return document.getElementById(id); }
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function bytes(value) {
  var n = Number(value) || 0;
  if (n < 1024) return n + ' Б';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' КБ';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' МБ';
  return (n / 1073741824).toFixed(2) + ' ГБ';
}
function dateText(value) {
  if (!value) return '—';
  var d = new Date(value);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function ago(value) {
  if (!value) return 'никогда';
  var diff = Date.now() - new Date(value).getTime();
  if (isNaN(diff)) return '—';
  if (diff < 60000) return 'только что';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' ч назад';
  return Math.floor(diff / 86400000) + ' дн назад';
}
function online(device) {
  return device.last_seen && Date.now() - new Date(device.last_seen).getTime() < 10 * 60 * 1000;
}
function toast(text) {
  var el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { el.classList.remove('show'); }, 2600);
}
function badge(text, cls) { return '<span class="badge ' + (cls || '') + '">' + esc(text) + '</span>'; }
function whoamiText() { return (state.email || 'администратор') + ' · Supabase'; }
function deviceOwner(device) {
  var user = state.users.find(function (item) { return item.id === device.account_id; });
  return user ? user : null;
}

// ------------------------------------------------------------------ auth
async function init() {
  var session = await supabase.auth.getSession();
  if (session.data.session) {
    state.email = session.data.session.user.email || '';
    showApp();
    await load();
    subscribe();
  }
  supabase.auth.onAuthStateChange(function (event, session2) {
    if (event === 'SIGNED_IN' && session2) {
      state.email = session2.user.email || '';
      showApp();
      setTimeout(function () { load(); subscribe(); }, 0);
    }
    if (event === 'SIGNED_OUT') showLogin();
  });
}
function showLogin() {
  $('loginView').classList.remove('hidden');
  $('appView').classList.add('hidden');
  state.realtime = null;
}
function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('whoami').textContent = whoamiText();
}
$('loginForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  var button = $('loginBtn');
  $('loginError').textContent = '';
  button.disabled = true;
  button.textContent = 'Вход…';
  var result = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });
  button.disabled = false;
  button.textContent = 'Войти';
  if (result.error) {
    $('loginError').textContent = 'Неверный email или пароль';
    return;
  }
  state.email = result.data.user.email || '';
  showApp();
  await load();
  subscribe();
});
$('logoutBtn').addEventListener('click', async function () {
  if (state.realtime) { supabase.removeChannel(state.realtime); state.realtime = null; }
  await supabase.auth.signOut();
  showLogin();
});
$('refreshBtn').addEventListener('click', function () { load(); });

// ------------------------------------------------------------------ data
async function load() {
  if (state.loading) return;
  state.loading = true;
  try {
    var results = await Promise.all([
      supabase.from('devices').select('*').order('last_seen', { ascending: false }).limit(500),
      supabase.from('feedback').select('*').order('created_at', { ascending: false }).limit(200),
      supabase.from('events').select('*').order('created_at', { ascending: false }).limit(200),
      supabase.from('commands').select('*').order('created_at', { ascending: false }).limit(300),
      panel('admin_list_users', {})
    ]);
    if (results[0].error) throw results[0].error;
    if (results[1].error) throw results[1].error;
    if (results[2].error) throw results[2].error;
    if (results[3].error) throw results[3].error;
    state.devices = results[0].data || [];
    state.feedback = results[1].data || [];
    state.events = results[2].data || [];
    state.commands = results[3].data || [];
    state.users = (results[4] && results[4].ok && results[4].data.users) ? results[4].data.users : [];
    render();
  } catch (error) {
    toast('Ошибка загрузки: ' + (error.message || error));
  } finally {
    state.loading = false;
  }
}

async function panel(action, payload) {
  var session = await supabase.auth.getSession();
  var token = session.data.session ? session.data.session.access_token : '';
  var response = await fetch(PANEL_FUNCTION, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ v: 2, action: action }, payload || {}))
  });
  var body = await response.json().catch(function () { return null; });
  if (!body) throw new Error('Сервер вернул пустой ответ');
  return body;
}

function subscribe() {
  if (state.realtime) supabase.removeChannel(state.realtime);
  state.realtime = supabase.channel('admin-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'devices' }, scheduleLoad)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'commands' }, scheduleLoad)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'feedback' }, scheduleLoad)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, scheduleLoad)
    .subscribe();
}
var loadTimer = null;
function scheduleLoad() {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(function () { load(); }, 700);
}

// ------------------------------------------------------------------ render
$('tabs').addEventListener('click', function (event) {
  var tab = event.target.closest('[data-tab]');
  if (!tab) return;
  state.tab = tab.dataset.tab;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (el) {
    el.classList.toggle('active', el.dataset.tab === state.tab);
  });
  render();
});
$('search').addEventListener('input', function () {
  state.search = this.value.trim().toLowerCase();
  render();
});

function render() {
  $('whoami').textContent = whoamiText();
  $('statDevices').textContent = state.devices.filter(function (d) { return !d.archived; }).length;
  $('statOnline').textContent = state.devices.filter(function (d) { return !d.archived && online(d); }).length;
  $('statUsers').textContent = state.users.length;
  $('statFeedback').textContent = state.feedback.filter(function (f) { return f.status === 'new'; }).length;
  $('createUserBtn').classList.toggle('hidden', state.tab !== 'users');

  if (state.tab === 'devices') $('view').innerHTML = renderDevices();
  else if (state.tab === 'users') $('view').innerHTML = renderUsers();
  else if (state.tab === 'feedback') $('view').innerHTML = renderFeedback();
  else $('view').innerHTML = renderEvents();
}

function filtered(list, mapper) {
  if (!state.search) return list;
  return list.filter(function (item) {
    return mapper(item).toLowerCase().indexOf(state.search) >= 0;
  });
}

// ------------------------------------------------------------------ devices
function renderDevices() {
  var list = filtered(state.devices, function (d) {
    var owner = deviceOwner(d);
    return [d.name, d.hwid, d.model, d.os, d.server, d.node_name, owner && owner.username].join(' ');
  });
  if (!list.length) {
    return '<div class="empty"><b>Устройств нет</b>Клиент появится здесь после первого входа и heartbeat.</div>';
  }
  return '<div class="grid">' + list.map(deviceCard).join('') + '</div>';
}

function deviceCard(device) {
  var up = online(device);
  var owner = deviceOwner(device);
  var ownerName = owner ? owner.username : (device.account_id ? 'аккаунт удалён' : 'без аккаунта');
  return '<article class="card' + (up ? '' : ' offline') + '" data-hwid="' + esc(device.hwid) + '">' +
    '<div class="card-head">' +
      '<div class="logo" style="width:38px;height:38px;border-radius:11px"><svg viewBox="0 0 32 32" fill="none" style="width:22px;height:22px"><path d="M16 3.2 27 7v8.6c0 6.4-4.4 10.9-11 13.2C9.4 26.5 5 22 5 15.6V7l11-3.8Z" fill="#fff"/><path d="M12 10.5v6.2c0 2.6 1.7 4.2 4 4.2s4-1.6 4-4.2v-6.2" stroke="#E5484D" stroke-width="2.6" stroke-linecap="round"/></svg></div>' +
      '<div style="min-width:0;flex:1"><div class="card-title">' + esc(device.name || device.model || device.hwid) + '</div>' +
      '<div class="card-sub">' + esc(device.hwid) + '</div></div>' +
      '<div style="text-align:right">' + (up ? badge('онлайн', 'green') : badge('офлайн', '')) +
      (device.blocked ? ' ' + badge('блок', 'red') : '') + '</div>' +
    '</div>' +
    '<div class="kv">' +
      '<div><span>Пользователь</span><b>' + esc(ownerName) + '</b></div>' +

// Снимок, который приложение присылает при запросе подписки.
function renderAppView(device) {
  var view = device.config_view && typeof device.config_view === 'object' ? device.config_view : null;
  if (!view || !Object.keys(view).length) {
    return '<div class="section"><div class="section-head"><i class="dot"></i>Как видит приложение</div>' +
      '<div class="section-body"><div class="hint">Клиент ещё не присылал снимок подписки.</div></div></div>';
  }
  var identity = view.identity && typeof view.identity === 'object' ? view.identity : {};
  var provider = view.provider && typeof view.provider === 'object' ? view.provider : null;
  var subscription = view.subscription && typeof view.subscription === 'object' ? view.subscription : null;
  var updated = view.updatedAt ? dateText(view.updatedAt) : (device.config_view_at ? dateText(device.config_view_at) : '—');
  var html = '<div class="section"><div class="section-head"><i class="dot"></i>Как видит приложение' +
    '<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:10.5px">' + esc(updated) + '</span></div><div class="section-body">' +
    '<div class="identity">' +
      cell('app', view.app || '—') +
      cell('format', view.format || '—') +
      cell('device', view.device || '—') +
      cell('hwid', view.hwid || device.hwid) +
      cell('identity.model', identity.model || '—') +
      cell('identity.os', identity.os || '—') +
      cell('identity.osVersion', identity.osVersion || '—') +
      cell('identity.core', identity.core || '—') +
    '</div>';
  if (provider) {
    html += '<div class="section-head" style="margin-top:16px"><i class="dot"></i>Провайдер видит' +
      '<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:10.5px">из настроек</span></div>' +
      '<div class="identity" style="margin-top:8px">' +
        cell('model', provider.model || '—') +
        cell('os', provider.os || '—') +
        cell('osVersion', provider.osVersion || '—') +
        cell('core', provider.core || '—') +
      '</div>';
  }
  if (subscription) {
    var providers = Array.isArray(subscription.providers) ? subscription.providers : [];
    html += '<div class="kv" style="margin-top:12px">' +
      '<div><span>Провайдеров</span><b>' + providers.length + '</b></div>' +
      '<div><span>Узлов</span><b>' + esc(subscription.nodesTotal != null ? subscription.nodesTotal : '—') + '</b></div>' +
      '<div><span>Выбранный узел</span><b>' + esc(subscription.selected || subscription.nodeName || '—') + '</b></div>' +
      '<div><span>Синхронизация</span><b>' + esc(subscription.syncedAt ? dateText(subscription.syncedAt) : '—') + '</b></div>' +
      '</div>';
    if (providers.length) {
      html += '<div style="margin-top:10px">' + providers.map(function (provider) {
        return '<div class="provider">' + badge(provider.name || provider.id || 'провайдер', provider.ok === false ? 'red' : 'green') +
          '<span class="muted" style="font-size:11.5px">' + esc(provider.nodes != null ? provider.nodes + ' узлов' : '') +
          (provider.error ? ' · ' + esc(provider.error) : '') + '</span></div>';
      }).join('') + '</div>';
    }
    if (Array.isArray(subscription.errors) && subscription.errors.length) {
      html += '<div class="hint" style="color:#ffb4b6">' + subscription.errors.map(esc).join('<br>') + '</div>';
    }
  }
  html += '<details><summary>Сырой JSON от приложения</summary><pre>' + esc(JSON.stringify(view, null, 2)) + '</pre></details>';
  html += '</div></div>';
  return html;
}
function cell(label, value) {
  return '<div><span>' + esc(label) + '</span><b>' + esc(value) + '</b></div>';
}

$('view').addEventListener('click', async function (event) {
  var button = event.target.closest('[data-act]');
  if (!button) return;
  var card = button.closest('[data-hwid]');
  if (!card) return;
  var hwid = card.dataset.hwid;
  var device = state.devices.find(function (item) { return item.hwid === hwid; });
  if (!device) return;
  var act = button.dataset.act;

  if (act === 'vpn_on' || act === 'vpn_off') {
    await sendCommand(hwid, act, {});
  } else if (act === 'block' || act === 'unblock') {
    await sendCommand(hwid, act, {});
  } else if (act === 'message') {
    openMessageModal(device);
  } else if (act === 'assign') {
    openAssignModal(device);
  } else if (act === 'archive') {
    var result = await supabase.from('devices').update({ archived: !device.archived }).eq('hwid', hwid);
    if (result.error) toast(result.error.message); else { toast(device.archived ? 'Устройство возвращено' : 'Устройство в архиве'); load(); }
  }
});

async function sendCommand(hwid, type, args) {
  var id = 'cmd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  var result = await supabase.from('commands').insert({ id: id, hwid: hwid, type: type, args: args || {}, created_by: state.email });
  if (result.error) { toast(result.error.message); return; }
  toast('Команда отправлена');
  setTimeout(load, 900);
}

function openMessageModal(device) {
  openModal('Сообщение на устройство', '' +
    '<div class="field"><label>Заголовок</label><input class="input" id="mTitle" value="UltraVPN"></div>' +
    '<div class="field"><label>Текст</label><textarea id="mText" placeholder="Текст сообщения"></textarea></div>',
    async function () {
      var text = $('mText').value.trim();
      if (!text) { toast('Введите текст'); return false; }
      await sendCommand(device.hwid, 'message', { title: $('mTitle').value.trim() || 'UltraVPN', text: text });

}

function openSubscriptionModal(user) {
  var sub = user.subscription && typeof user.subscription === 'object' ? user.subscription : {};
  var providers = Array.isArray(sub.providers) ? sub.providers : [];
  var settings = user.settings && typeof user.settings === 'object' ? user.settings : {};
  var device = settings.device && typeof settings.device === 'object' ? settings.device : {};
  var otherSettings = {};
  Object.keys(settings).forEach(function (key) {
    if (key !== 'device') otherSettings[key] = settings[key];
  });
  var rows = providers.map(providerRow).join('');
  openModal('Подписка и настройки · ' + user.username, '' +
    '<div class="section" style="margin-top:0"><div class="section-head"><i class="dot"></i>Провайдеры</div><div class="section-body">' +
      '<div id="providers">' + rows + '</div>' +
      '<button class="btn small" id="addProvider" type="button">+ Провайдер</button>' +
      '<div class="hint">Ссылки видны только администратору и клиенту при синхронизации. В интерфейсе пользователя их нет.</div>' +
    '</div></div>' +
    '<div class="section" style="margin-top:4px"><div class="section-head"><i class="dot"></i>Данные для провайдера</div><div class="section-body">' +
      '<div class="form-row">' +
        '<div class="field"><label>Модель</label><input class="input" id="subDeviceModel" placeholder="Xiaomi 23090RA98G" value="' + esc(device.model || '') + '"></div>' +
        '<div class="field"><label>Система</label><input class="input" id="subDeviceOs" placeholder="Android" value="' + esc(device.os || '') + '"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Версия системы</label><input class="input mono" id="subDeviceOsVersion" placeholder="16" value="' + esc(device.osVersion || '') + '"></div>' +
        '<div class="field"><label>Версия ядра</label><input class="input mono" id="subDeviceCore" placeholder="2.0.0" value="' + esc(device.core || '') + '"></div>' +
      '</div>' +
      '<div class="hint">Клиент подставит эти значения в заголовки x-device-* / x-ver-* при запросе подписки. В панели при этом видно настоящее устройство. Пустое поле — реальное значение клиента.</div>' +
    '</div></div>' +
    '<div class="form-row" style="margin-top:4px">' +
      '<div class="field"><label>Выбор сервера</label><select id="subAuto"><option value="true"' + (sub.autoSelect !== false ? ' selected' : '') + '>Автоматически</option><option value="false"' + (sub.autoSelect === false ? ' selected' : '') + '>Вручную</option></select></div>' +
      '<div class="field"><label>Маршрутизация</label><select id="subRouting"><option value="global"' + (sub.routing !== 'split' ? ' selected' : '') + '>Весь трафик</option><option value="split"' + (sub.routing === 'split' ? ' selected' : '') + '>Выборочно</option></select></div>' +
    '</div>' +
    '<div class="field"><label>Другие настройки (JSON)</label><textarea id="subSettings" class="mono">' + esc(JSON.stringify(otherSettings, null, 2)) + '</textarea>' +
    '<div class="hint">Сюда можно передать splitApps, excludeApps и другие параметры клиента. Данные провайдера задаются полями выше.</div></div>',
    async function () {
      var list = [];
      Array.prototype.forEach.call(document.querySelectorAll('#providers .provider'), function (row) {
        var name = row.querySelector('[data-pname]').value.trim();
        var url = row.querySelector('[data-purl]').value.trim();
        var enabled = row.querySelector('[data-penabled]').checked;
        if (url) list.push({ name: name || ('Подписка ' + (list.length + 1)), url: url, enabled: enabled });
      });
      var parsedSettings;
      try { parsedSettings = JSON.parse($('subSettings').value || '{}'); }
      catch (error) { toast('Настройки: неверный JSON'); return false; }
      parsedSettings.device = {
        model: $('subDeviceModel').value.trim(),
        os: $('subDeviceOs').value.trim(),
        osVersion: $('subDeviceOsVersion').value.trim(),
        core: $('subDeviceCore').value.trim()
      };
      var subscription = {
        providers: list,
        autoSelect: $('subAuto').value === 'true',
        routing: $('subRouting').value,
        updatedAt: Date.now()
      };
      var result = await panel('admin_update_user', { userId: user.id, patch: { subscription: subscription, settings: parsedSettings } });
      if (!result.ok) { toast(result.message || 'Ошибка'); return false; }
      toast('Подписка сохранена');
      load();
      return true;
    });
  $('addProvider').addEventListener('click', function () {
    var wrap = $('providers');
    var temp = document.createElement('div');
    temp.innerHTML = providerRow({ name: '', url: '', enabled: true });
    wrap.appendChild(temp.firstElementChild);
  });
  document.querySelectorAll('[data-premove]').forEach(function (button) {
    button.addEventListener('click', function () { button.closest('.provider').remove(); });
  });
}
function providerRow(provider) {
  return '<div class="provider">' +
    '<input class="input" data-pname placeholder="Название" value="' + esc(provider.name || '') + '">' +
    '<input class="input" data-purl placeholder="https://…" value="' + esc(provider.url || '') + '">' +
    '<label class="check" style="margin:0"><input type="checkbox" data-penabled' + (provider.enabled !== false ? ' checked' : '') + '></label>' +
    '<button class="btn small ghost" type="button" data-premove>×</button>' +
  '</div>';
}

  if (!card) return;
  var item = state.feedback.find(function (row) { return row.id === card.dataset.feedback; });
  if (!item) return;
  if (button.dataset.fact === 'read') {
    var result = await supabase.from('feedback').update({ status: 'read' }).eq('id', item.id);
    if (result.error) toast(result.error.message); else load();
  }
  if (button.dataset.fact === 'open') {
    state.tab = 'devices';
    state.search = item.hwid.toLowerCase();
    $('search').value = item.hwid;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (el) { el.classList.toggle('active', el.dataset.tab === 'devices'); });
    render();
  }
});

// ------------------------------------------------------------------ events
function renderEvents() {
  var list = filtered(state.events, function (item) { return [item.hwid, item.type, item.message].join(' '); }).slice(0, 120);
  if (!list.length) return '<div class="empty"><b>Событий нет</b>Здесь появится журнал действий клиентов.</div>';
  return '<div class="card" style="padding:6px 14px">' + list.map(function (item) {
    return '<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start">' +
      '<div class="muted mono" style="flex:0 0 128px">' + esc(dateText(item.created_at)) + '</div>' +
      '<div style="min-width:0"><b style="font-size:12.5px">' + esc(item.type) + '</b>' +
      '<div class="muted" style="font-size:12px;word-break:break-word">' + esc(item.message || item.hwid) + '</div></div></div>';
  }).join('') + '</div>';
}

// ------------------------------------------------------------------ modal
function openModal(title, body, onSubmit) {
  var root = $('modalRoot');
  root.innerHTML = '<div class="modal-back"><form class="modal" id="modalForm"><h2>' + esc(title) + '</h2>' +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-actions"><button class="btn ghost" type="button" id="modalCancel">Отмена</button>' +
    '<button class="btn primary" type="submit" id="modalSubmit">Сохранить</button></div></form></div>';
  function close() { root.innerHTML = ''; }
  $('modalCancel').addEventListener('click', close);
  root.querySelector('.modal-back').addEventListener('click', function (event) { if (event.target === this) close(); });
  $('modalForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    var button = $('modalSubmit');
    button.disabled = true;
    button.textContent = 'Сохранение…';
    var ok = await onSubmit();
    button.disabled = false;
    button.textContent = 'Сохранить';
    if (ok) close();
  });
  setTimeout(function () {
    var first = root.querySelector('input,textarea,select');
    if (first) first.focus();
  }, 50);
}

// ------------------------------------------------------------------ pwa
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}

init();
</script>
</body>
</html>
