<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="description" content="UltraVPN — административная панель">
<title>UltraVPN · Админ-панель</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#0b0b0e; --surface:#141419; --surface2:#1b1b22; --surface3:#22222b;
  --line:#2a2a33; --line2:#383843;
  --text:#f5f5f7; --muted:#9a9aa5; --muted2:#6f6f7a;
  --red:#e5484d; --red2:#ff5c61; --red-dark:#b2363a;
  --green:#34d399; --amber:#fbbf24; --blue:#60a5fa;
  --radius:18px; --radius-sm:12px;
  --shadow:0 18px 60px rgba(0,0,0,.42);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(229,72,77,.18),transparent 60%),var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:390px;background:linear-gradient(180deg,var(--surface),#101015);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}
.logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--red2),var(--red-dark));box-shadow:0 10px 30px rgba(229,72,77,.35);flex:0 0 auto}
.logo svg{width:27px;height:27px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45}
.field{margin-top:14px}
.field label{display:block;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;transition:.15s}
.input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.16)}
textarea{resize:vertical;min-height:72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:9px 13px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--surface3)}
.btn.primary{background:linear-gradient(135deg,var(--red2),var(--red-dark));border-color:transparent;box-shadow:0 8px 22px rgba(229,72,77,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#ffb4b6;border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.1)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 9px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.icon{width:17px;height:17px;display:inline-block;vertical-align:-3px}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 60px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px;flex-wrap:wrap}
header.top h1{font-size:17px}
header.top .sub{font-size:11.5px}
.spacer{flex:1}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;overflow:auto;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.tab.active{background:rgba(229,72,77,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(229,72,77,.3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:11.5px}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:360px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--surface),#111116);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 10px 34px rgba(0,0,0,.18)}
.card.offline{opacity:.82}
.card-head{display:flex;gap:11px;align-items:flex-start}
.card-title{font-weight:700;font-size:15px;line-height:1.25;word-break:break-word}
.card-sub{color:var(--muted);font-size:11.5px;margin-top:3px;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.badge.green{color:#8ff0c9;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.09)}
.badge.red{color:#ffb4b6;border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.1)}
.badge.amber{color:#ffe08a;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.09)}
.badge.blue{color:#b7d5ff;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.09)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
.kv div{min-width:0}
.kv span{display:block;color:var(--muted2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kv b{font-size:12.5px;font-weight:600;word-break:break-word}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.section{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#101015;overflow:hidden}
.section-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.02em}
.section-head .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(229,72,77,.12)}
.section-body{padding:12px}
.section-body .kv{margin-top:0}
.identity{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.identity .wide{grid-column:1/-1}
.identity span{display:block;color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.identity b{font-size:12px;font-weight:600;word-break:break-word}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:11.5px;user-select:none}
pre{white-space:pre-wrap;word-break:break-word;background:#0a0a0d;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0;max-height:260px;overflow:auto;font-size:11px;color:#c9c9d2}
.provider{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.provider .input{flex:1;min-width:0;padding:8px 9px;font-size:12px}
.empty{padding:44px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#22222b;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:13px;max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:90;padding:0}
.modal{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:20px;box-shadow:var(--shadow)}
@media(min-width:640px){.modal-back{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h2{font-size:17px;margin:0 0 4px}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px}
.check input{width:auto;accent-color:var(--red)}
.sub-pick{margin-top:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text)}
.sub-pick + .sub-pick{margin-top:6px}
.sub-pick span{flex:1;min-width:0}
.hint{color:var(--muted2);font-size:11px;line-height:1.5;margin-top:6px}

/* ---------- dashboard / subscriptions ---------- */
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{background:linear-gradient(180deg,var(--surface),#111116);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:0 10px 34px rgba(0,0,0,.18);min-width:0}
.panel.wide{grid-column:1/-1}
.panel-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;letter-spacing:.02em;margin-bottom:12px;flex-wrap:wrap}
.panel-head .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(229,72,77,.12)}
.panel-head .spacer{flex:1}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.metric{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-width:0}
.metric b{display:block;font-size:21px;letter-spacing:-.02em;line-height:1.15}
.metric span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.metric em{display:block;font-style:normal;color:var(--muted2);font-size:10.5px;margin-top:3px}
.metric.red b{color:var(--red2)}
.metric.green b{color:var(--green)}
.metric.amber b{color:var(--amber)}
.bar-row{display:grid;grid-template-columns:minmax(80px,140px) 1fr 34px;gap:9px;align-items:center;margin-bottom:8px;font-size:12px}
.bar-row:last-child{margin-bottom:0}
.bar-row>span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row>b{text-align:right;font-weight:600;font-size:11.5px;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red2),var(--red-dark));min-width:2px}
.list-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.list-row:last-child{border-bottom:0;padding-bottom:0}
.list-row:first-child{padding-top:0}
.list-row .when{flex:0 0 96px;color:var(--muted2);font-size:11px}
.list-row .grow{flex:1;min-width:0;word-break:break-word}
.list-row .grow small{display:block;color:var(--muted);font-size:11px;margin-top:2px;word-break:break-word}
.sub-url{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9c9d2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.sub-url a{color:#8ab4ff;text-decoration:none}
.sub-url a:hover{text-decoration:underline}
.provider-link{color:#8ab4ff;font-size:11px;text-decoration:none;white-space:nowrap}
.provider-link:hover{text-decoration:underline}
a.btn{color:var(--text);text-decoration:none}
.sub-devices{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.sub-device{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:11.5px}
.sub-device .grow{flex:1;min-width:0}
.sub-device small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.sub-preview{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.sub-preview-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600}
.sub-preview-head .spacer{flex:1}
.sub-preview-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}
.node-list{max-height:230px;overflow:auto;margin-top:8px;border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.node-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:11.5px}
.node-row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-row span{color:var(--muted2);font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}
.node-more{color:var(--muted2);font-size:10.5px;padding-top:2px}
.sub-preview details summary{cursor:pointer;font-size:11.5px;color:var(--muted);margin-top:8px}
.split-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart-caption{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:5px}
.chart-caption i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chart-caption b{margin-left:auto;color:var(--text);font-weight:600}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.donut-block{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;min-width:0}
.donut{width:132px;height:132px;flex:0 0 auto}
.donut svg{display:block;width:100%;height:100%}
.donut-legend{width:100%;display:flex;flex-direction:column;gap:5px}
.donut-item{display:flex;align-items:center;gap:7px;font-size:11.5px;min-width:0}
.donut-item i{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.donut-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.donut-item b{font-weight:600}
.donut-item em{font-style:normal;color:var(--muted2);font-size:10.5px;min-width:30px;text-align:right}
@media(max-width:900px){.home-grid{grid-template-columns:1fr}.split-2{grid-template-columns:1fr}}
@media(max-width:720px){
  .wrap{padding:12px 12px 50px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  header.top h1{font-size:15px}
  .login-card{padding:22px}
}
</style>
</head>

<script>
'use strict';
var SUPABASE_URL = 'https://jzoilllbyfitlsxvaobd.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_T-yxdb2fgqyhsPa1Gk8TyA_ACPTWJ0i';
var PANEL_FUNCTION = SUPABASE_URL + '/functions/v1/panel';
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var state = {
  email: '',
  tab: 'home',
  search: '',
  devices: [],
  users: [],
  subscriptions: [],
  feedback: [],
  events: [],
  commands: [],
  settings: {},

function $(id) { return document.getElementById(id); }
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function bytes(value) {
  var n = Number(value) || 0;
  if (n < 1024) return n + ' Б';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' КБ';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' МБ';
  return (n / 1073741824).toFixed(2) + ' ГБ';
}
function dateText(value) {
  if (!value) return '—';
  var d = new Date(value);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function dateInputValue(value) {
  if (!value) return '';
  var d = new Date(value);
  if (isNaN(d.getTime())) return '';
  var month = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + month + '-' + day;
}
function ago(value) {
  if (!value) return 'никогда';
  var diff = Date.now() - new Date(value).getTime();
  if (isNaN(diff)) return '—';
  if (diff < 60000) return 'только что';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' ч назад';
  return Math.floor(diff / 86400000) + ' дн назад';
}
function online(device) {
  return device.last_seen && Date.now() - new Date(device.last_seen).getTime() < 10 * 60 * 1000;
}
function toast(text) {
  var el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { el.classList.remove('show'); }, 2600);
}
function badge(text, cls) { return '<span class="badge ' + (cls || '') + '">' + esc(text) + '</span>'; }
function whoamiText() { return (state.email || 'администратор') + ' · Supabase'; }
function deviceOwner(device) {
  var user = state.users.find(function (item) { return item.id === device.account_id; });
  return user ? user : null;
}

// ------------------------------------------------------------------ auth
async function init() {
  var session = await supabase.auth.getSession();
  if (session.data.session) {
    state.email = session.data.session.user.email || '';
    showApp();
    await load();
    subscribe();
  }
  supabase.auth.onAuthStateChange(function (event, session2) {
    if (event === 'SIGNED_IN' && session2) {
      state.email = session2.user.email || '';
      showApp();
      setTimeout(function () { load(); subscribe(); }, 0);
    }
    if (event === 'SIGNED_OUT') showLogin();
  });
}
function showLogin() {
  $('loginView').classList.remove('hidden');
  $('appView').classList.add('hidden');
  state.realtime = null;
}
function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('whoami').textContent = whoamiText();
}
$('loginForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  var button = $('loginBtn');
  $('loginError').textContent = '';
  button.disabled = true;
  button.textContent = 'Вход…';
  var result = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });
  button.disabled = false;
  button.textContent = 'Войти';
  if (result.error) {
    $('loginError').textContent = 'Неверный email или пароль';
    return;
  }
  state.email = result.data.user.email || '';
  showApp();
  await load();
  subscribe();
});
$('logoutBtn').addEventListener('click', async function () {
  if (state.realtime) { supabase.removeChannel(state.realtime); state.realtime = null; }
  await supabase.auth.signOut();
  showLogin();
});
$('refreshBtn').addEventListener('click', function () { load(); });

// ------------------------------------------------------------------ data
async function load() {
  if (state.loading) return;
  state.loading = true;
  try {
    var results = await Promise.all([
      supabase.from('devices').select('*').order('last_seen', { ascending: false }).limit(500),
      supabase.from('feedback').select('*').order('created_at', { ascending: false }).limit(200),
      supabase.from('events').select('*').order('created_at', { ascending: false }).limit(200),
      supabase.from('commands').select('*').order('created_at', { ascending: false }).limit(300),
      panel('admin_list_users', {}),
      panel('admin_get_settings', {}),
      panel('admin_list_subscriptions', {})
    ]);
    if (results[0].error) throw results[0].error;
    if (results[1].error) throw results[1].error;
    if (results[2].error) throw results[2].error;
    if (results[3].error) throw results[3].error;
    state.devices = results[0].data || [];
    state.feedback = results[1].data || [];
    state.events = results[2].data || [];
    state.commands = results[3].data || [];
    state.users = (results[4] && results[4].ok && results[4].data.users) ? results[4].data.users : [];
    state.settings = (results[5] && results[5].ok && results[5].data.settings) ? results[5].data.settings : {};
    state.subscriptions = (results[6] && results[6].ok && results[6].data.subscriptions) ? results[6].data.subscriptions : [];
    state.loadedAt = Date.now();
    render();
  } catch (error) {
    toast('Ошибка загрузки: ' + (error.message || error));
  } finally {
    state.loading = false;
  }
}

async function panel(action, payload) {
  var session = await supabase.auth.getSession();
  var token = session.data.session ? session.data.session.access_token : '';
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, 20000);
  try {
    var response = await fetch(PANEL_FUNCTION, {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(Object.assign({ v: 2, action: action }, payload || {}))
    });
    var body = await response.json().catch(function () { return null; });
    if (!body) throw new Error('Сервер вернул пустой ответ');
    return body;
  } catch (error) {
    if (error && error.name === 'AbortError') throw new Error('Сервер не ответил за 20 секунд');
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

function subscribe() {
  if (state.realtime) supabase.removeChannel(state.realtime);
  state.realtime = supabase.channel('admin-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'devices' }, scheduleLoad)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'commands' }, scheduleLoad)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'feedback' }, scheduleLoad)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, scheduleLoad)
    .subscribe();
}
var loadTimer = null;
function scheduleLoad() {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(function () { load(); }, 700);
}

// ------------------------------------------------------------------ render
$('tabs').addEventListener('click', function (event) {
  var tab = event.target.closest('[data-tab]');
  if (!tab) return;
  state.tab = tab.dataset.tab;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (el) {
    el.classList.toggle('active', el.dataset.tab === state.tab);
  });
  render();
});
$('search').addEventListener('input', function () {
  state.search = this.value.trim().toLowerCase();
  render();
});

function render() {
  $('whoami').textContent = whoamiText();
  var activeDeviceGroups = deviceGroups(state.devices.filter(function (d) { return !d.archived; }));
  $('statDevices').textContent = activeDeviceGroups.length;
  $('statOnline').textContent = activeDeviceGroups.filter(groupOnline).length;
  $('statUsers').textContent = state.users.length;
  $('statFeedback').textContent = state.feedback.filter(function (f) { return f.status === 'new'; }).length;
  $('createUserBtn').classList.toggle('hidden', state.tab !== 'users');
  $('stats').classList.toggle('hidden', state.tab === 'home');
  $('toolbar').classList.toggle('hidden', state.tab === 'home');
  $('search').classList.toggle('hidden', state.tab === 'settings');

  if (state.tab === 'home') $('view').innerHTML = renderHome();
  else if (state.tab === 'devices') $('view').innerHTML = renderDevices();
  else if (state.tab === 'users') $('view').innerHTML = renderUsers();
  else if (state.tab === 'subscriptions') $('view').innerHTML = renderSubscriptions();
  else if (state.tab === 'settings') $('view').innerHTML = renderSettings();
  else if (state.tab === 'feedback') $('view').innerHTML = renderFeedback();
  else $('view').innerHTML = renderEvents();
}

function filtered(list, mapper) {
  if (!state.search) return list;
  return list.filter(function (item) {
    return mapper(item).toLowerCase().indexOf(state.search) >= 0;
  });
}

// ------------------------------------------------------------------ devices
// Переустановка одной и той же версии (Full→Full, Lite→Lite) меняет HWID,
// но для админки это одно устройство: склеиваем по аккаунту, платформе,
// модели и редакции. Full и Lite — разные приложения, их можно держать
// установленными одновременно, поэтому это два отдельных устройства.
function deviceEdition(device) {
  if (!device) return 'full';
  var version = String(device.app_version || '').toLowerCase();
  if (version.indexOf('lite') >= 0) return 'lite';
  var view = device.config_view && typeof device.config_view === 'object' ? device.config_view : null;
  var identity = view && view.identity && typeof view.identity === 'object' ? view.identity : null;
  var core = identity ? String(identity.core || '').toLowerCase() : '';
  return core.indexOf('lite') >= 0 ? 'lite' : 'full';
}

function deviceGroupKey(device) {
  if (!device) return '';
  if (!device.account_id) return 'hwid:' + (device.hwid || '');
  return [
    device.account_id,
    String(device.platform || device.os || '').toLowerCase(),
    String(device.model || device.name || '').trim().toLowerCase(),
    deviceEdition(device)
  ].join('|');
}

function deviceGroups(devices) {
  var map = {};
  (devices || []).forEach(function (device) {
    var key = deviceGroupKey(device);
    if (!map[key]) map[key] = { key: key, items: [] };
    map[key].items.push(device);
  });
  var groups = Object.keys(map).map(function (key) {
    var group = map[key];
    group.items.sort(function (a, b) {
      return new Date(b.last_seen || 0).getTime() - new Date(a.last_seen || 0).getTime();
    });
    group.latest = group.items.filter(function (device) { return !device.archived; })[0] || group.items[0];
    return group;
  });
  groups.sort(function (a, b) {
    return new Date(b.latest.last_seen || 0).getTime() - new Date(a.latest.last_seen || 0).getTime();
  });
  return groups;
}

function groupOnline(group) {
  return group.items.some(function (device) { return online(device); });
}

function dedupedDevices(devices) {
  return deviceGroups(devices).map(function (group) { return group.latest; });
}

function renderDevices() {
  var groups = deviceGroups(state.devices);
  if (state.search) {
    groups = groups.filter(function (group) {
      return group.items.some(function (device) {
        var owner = deviceOwner(device);
        return [device.name, device.hwid, device.model, device.os, device.server, device.node_name, owner && owner.username]
          .join(' ').toLowerCase().indexOf(state.search) >= 0;
      });
    });
  }
  if (!groups.length) {
    return '<div class="empty"><b>Устройств нет</b>Клиент появится здесь после первого входа и heartbeat.</div>';
  }
  return '<div class="grid">' + groups.map(function (group) {
    return deviceCard(group.latest);
  }).join('') + '</div>';
}

function deviceCard(device) {
  var up = online(device);
  var owner = deviceOwner(device);
  var ownerName = owner ? owner.username : (device.account_id ? 'аккаунт удалён' : 'без аккаунта');
  return '<article class="card' + (up ? '' : ' offline') + '" data-hwid="' + esc(device.hwid) + '">' +
    '<div class="card-head">' +
      '<div class="logo" style="width:38px;height:38px;border-radius:11px"><svg viewBox="0 0 32 32" fill="none" style="width:22px;height:22px"><path d="M16 3.2 27 7v8.6c0 6.4-4.4 10.9-11 13.2C9.4 26.5 5 22 5 15.6V7l11-3.8Z" fill="#fff"/><path d="M12 10.5v6.2c0 2.6 1.7 4.2 4 4.2s4-1.6 4-4.2v-6.2" stroke="#E5484D" stroke-width="2.6" stroke-linecap="round"/></svg></div>' +
      '<div style="min-width:0;flex:1"><div class="card-title">' + esc(device.name || device.model || device.hwid) + '</div>' +
      '<div class="card-sub">' + esc(device.hwid) + '</div></div>' +
      '<div style="text-align:right">' + (up ? badge('онлайн', 'green') : badge('офлайн', '')) +
      (device.blocked ? ' ' + badge('блок', 'red') : '') + '</div>' +
    '</div>' +
    '<div class="kv">' +
      '<div><span>Пользователь</span><b>' + esc(ownerName) + '</b></div>' +
      '<div><span>Платформа</span><b>' + esc([device.os, device.os_version].filter(Boolean).join(' ') || '—') + '</b></div>' +
      '<div><span>Приложение</span><b>' + esc(device.app_version || '—') + '</b></div>' +
      '<div><span>Ядро</span><b>' + esc(device.core_version || '—') + '</b></div>' +
      '<div><span>VPN</span><b>' + esc(device.vpn_state || 'off') + (device.auto_selected ? ' · авто' : ' · вручную') + '</b></div>' +
      '<div><span>Сервер</span><b>' + esc(device.node_name || device.server || '—') + '</b></div>' +
      '<div><span>Трафик сессии</span><b>' + bytes((device.session_up || 0) + (device.session_down || 0)) + '</b></div>' +
      '<div><span>Всего</span><b>' + bytes((device.total_up || 0) + (device.total_down || 0)) + '</b></div>' +
      '<div><span>Сеть</span><b>' + esc(device.network || '—') + '</b></div>' +
      '<div><span>IP</span><b>' + esc(device.ip || '—') + '</b></div>' +
      '<div><span>Последняя связь</span><b>' + esc(ago(device.last_seen)) + '</b></div>' +
      '<div><span>Ошибка</span><b style="color:' + (device.last_error ? '#ffb4b6' : 'inherit') + '">' + esc(device.last_error || '—') + '</b></div>' +
    '</div>' +
    renderAppView(device) +
    '<div class="actions">' +
      '<button class="btn small" data-act="vpn_on">VPN вкл</button>' +
      '<button class="btn small" data-act="vpn_off">VPN выкл</button>' +
      '<button class="btn small" data-act="message">Сообщение</button>' +
      (device.blocked
        ? '<button class="btn small" data-act="unblock">Разблокировать</button>'
        : '<button class="btn small danger" data-act="block">Заблокировать</button>') +
      '<button class="btn small ghost" data-act="assign">Привязать</button>' +
      '<button class="btn small ghost" data-act="archive">' + (device.archived ? 'Вернуть' : 'Архив') + '</button>' +
    '</div>' +
  '</article>';
}

// Снимок, который приложение присылает при запросе подписки.
function renderAppView(device) {
  var view = device.config_view && typeof device.config_view === 'object' ? device.config_view : null;
  if (!view || !Object.keys(view).length) {
    return '<div class="section"><div class="section-head"><i class="dot"></i>Как видит приложение</div>' +
      '<div class="section-body"><div class="hint">Клиент ещё не присылал снимок подписки.</div></div></div>';
  }
  var identity = view.identity && typeof view.identity === 'object' ? view.identity : {};
  var provider = view.provider && typeof view.provider === 'object' ? view.provider : null;
  var subscription = view.subscription && typeof view.subscription === 'object' ? view.subscription : null;
  var updated = view.updatedAt ? dateText(view.updatedAt) : (device.config_view_at ? dateText(device.config_view_at) : '—');
  var html = '<div class="section"><div class="section-head"><i class="dot"></i>Как видит приложение' +
    '<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:10.5px">' + esc(updated) + '</span></div><div class="section-body">' +
    '<div class="identity">' +
      cell('app', (state.settings && state.settings.app) || view.app || '—') +
      cell('format', view.format || '—') +
      cell('device', view.device || '—') +
      cell('hwid', view.hwid || device.hwid) +
      cell('identity.model', identity.model || '—') +
      cell('identity.os', identity.os || '—') +
      cell('identity.osVersion', identity.osVersion || '—') +
      cell('identity.core', identity.core || '—') +
    '</div>';
  if (provider) {
    html += '<div class="section-head" style="margin-top:16px"><i class="dot"></i>Провайдер видит' +
      '<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:10.5px">из настроек</span></div>' +
      '<div class="identity" style="margin-top:8px">' +
        cell('hwid', provider.hwid || view.hwid || '—') +
        cell('model', provider.model || '—') +
        cell('os', provider.os || '—') +
        cell('osVersion', provider.osVersion || '—') +
        cell('core', provider.core || '—') +
      '</div>';
  }
  if (subscription) {
    var providers = Array.isArray(subscription.providers) ? subscription.providers : [];
    var expiredCount = providers.filter(providerExpired).length;
    html += '<div class="kv" style="margin-top:12px">' +
      '<div><span>Провайдеров</span><b>' + providers.length + (expiredCount ? ' (' + expiredCount + ' истекли)' : '') + '</b></div>' +
      '<div><span>Узлов</span><b>' + esc(subscription.nodesTotal != null ? subscription.nodesTotal : '—') + '</b></div>' +
      '<div><span>Выбранный узел</span><b>' + esc(subscription.selected || subscription.nodeName || '—') + '</b></div>' +
      '<div><span>Синхронизация</span><b>' + esc(subscription.syncedAt ? dateText(subscription.syncedAt) : '—') + '</b></div>' +
      '</div>';
    if (providers.length) {
      html += '<div style="margin-top:10px">' + providers.map(function (provider) {
        var isExpired = providerExpired(provider);
        return '<div class="provider">' + badge(provider.name || provider.id || 'провайдер', isExpired ? '' : (provider.ok === false ? 'red' : 'green')) +
          '<span class="muted" style="font-size:11.5px">' + esc(isExpired ? 'подписка истекла' : (provider.nodes != null ? provider.nodes + ' узлов' : '')) +
          (!isExpired && provider.error ? ' · ' + esc(provider.error) : '') + '</span>' + providerCabinetLink(provider) + '</div>';
      }).join('') + '</div>';
    }
    if (Array.isArray(subscription.errors) && subscription.errors.length) {
      var expiredNames = providers.filter(providerExpired).map(function (entry) { return entry.name || entry.id; });
      var visibleErrors = subscription.errors.filter(function (entry) {
        var text = String(entry);
        return !expiredNames.some(function (name) { return name && text.indexOf(name + ':') === 0; });
      });
      if (visibleErrors.length) {
        html += '<div class="hint" style="color:#ffb4b6">' + visibleErrors.map(esc).join('<br>') + '</div>';
      }
    }
  }
  html += '<details><summary>Сырой JSON от приложения</summary><pre>' + esc(JSON.stringify(view, null, 2)) + '</pre></details>';
  html += '</div></div>';
  return html;
}
function cell(label, value) {
  return '<div><span>' + esc(label) + '</span><b>' + esc(value) + '</b></div>';
}

$('view').addEventListener('click', async function (event) {
  var button = event.target.closest('[data-act]');
  if (!button) return;
  var card = button.closest('[data-hwid]');
  if (!card) return;
  var hwid = card.dataset.hwid;
  var device = state.devices.find(function (item) { return item.hwid === hwid; });
  if (!device) return;
  var act = button.dataset.act;

  if (act === 'vpn_on' || act === 'vpn_off') {
    await sendCommand(hwid, act, {});
  } else if (act === 'block' || act === 'unblock') {
    await sendCommand(hwid, act, {});
  } else if (act === 'message') {
    openMessageModal(device);
  } else if (act === 'assign') {
    openAssignModal(device);
  } else if (act === 'archive') {
    var result = await supabase.from('devices').update({ archived: !device.archived }).eq('hwid', hwid);
    if (result.error) toast(result.error.message); else { toast(device.archived ? 'Устройство возвращено' : 'Устройство в архиве'); load(); }
  }
});

async function sendCommand(hwid, type, args) {
  var id = 'cmd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  var result = await supabase.from('commands').insert({ id: id, hwid: hwid, type: type, args: args || {}, created_by: state.email });
  if (result.error) { toast(result.error.message); return; }
  toast('Команда отправлена');
  setTimeout(load, 900);
}

function openMessageModal(device) {
  openModal('Сообщение на устройство', '' +
    '<div class="field"><label>Заголовок</label><input class="input" id="mTitle" value="UltraVPN"></div>' +
    '<div class="field"><label>Текст</label><textarea id="mText" placeholder="Текст сообщения"></textarea></div>',
    async function () {
      var text = $('mText').value.trim();
      if (!text) { toast('Введите текст'); return false; }
      await sendCommand(device.hwid, 'message', { title: $('mTitle').value.trim() || 'UltraVPN', text: text });
      return true;
    });
}

function openAssignModal(device) {
  var options = '<option value="">Без аккаунта</option>' + state.users.map(function (user) {
    return '<option value="' + esc(user.id) + '"' + (user.id === device.account_id ? ' selected' : '') + '>' + esc(user.username) + '</option>';
  }).join('');
  openModal('Привязать устройство', '' +
    '<div class="hint" style="margin-bottom:10px">' + esc(device.name || device.hwid) + '</div>' +
    '<div class="field"><label>Аккаунт</label><select id="assignUser">' + options + '</select></div>',
    async function () {
      var result = await panel('admin_assign_device', { hwid: device.hwid, userId: $('assignUser').value });
      if (!result.ok) { toast(result.message || 'Ошибка'); return false; }
      toast('Устройство привязано');
      return true;
    });
}

// ------------------------------------------------------------------ users
function renderUsers() {
  var list = filtered(state.users, function (user) {
    return [user.username, user.display_name, user.plan, user.note].join(' ');
  });
  if (!list.length) {
    return '<div class="empty"><b>Пользователей нет</b>Создайте первый аккаунт кнопкой «+ Пользователь».</div>';
  }
  return '<div class="grid">' + list.map(userCard).join('') + '</div>';
}

function userCard(user) {
  var pub = user.public || user;
  var expired = pub.expiresAt && pub.expiresAt < Date.now();
  var userDeviceGroups = deviceGroups(Array.isArray(user.devices) ? user.devices : []);
  return '<article class="card" data-user="' + esc(user.id) + '">' +
    '<div class="card-head"><div style="min-width:0;flex:1">' +
      '<div class="card-title">' + esc(user.username) + '</div>' +
      '<div class="card-sub">' + esc(user.display_name || '') + '</div></div>' +
      '<div style="text-align:right">' + (user.status === 'blocked' ? badge('заблокирован', 'red') : badge('активен', 'green')) +
      (expired ? ' ' + badge('истёк', 'amber') : '') + '</div></div>' +
    '<div class="kv">' +
      '<div><span>Тариф</span><b>' + esc(user.plan || '—') + '</b></div>' +
      '<div><span>До</span><b>' + esc(user.expires_at ? dateText(user.expires_at) : 'бессрочно') + '</b></div>' +
      '<div><span>Лимит трафика</span><b>' + (Number(user.traffic_limit) ? bytes(user.traffic_limit) : 'без лимита') + '</b></div>' +
      '<div><span>Устройств</span><b>' + userDeviceGroups.length + '</b></div>' +
      '<div><span>Последний вход</span><b>' + esc(user.last_login_at ? ago(user.last_login_at) : '—') + '</b></div>' +
      '<div><span>Создан</span><b>' + esc(dateText(user.created_at)) + '</b></div>' +
      '<div class="wide" style="grid-column:1/-1"><span>Подписки</span><b>' + esc((user.subscription && Array.isArray(user.subscription.providerIds) ? user.subscription.providerIds.length : 0) + ' из ' + state.subscriptions.length + ' доступных') + '</b></div>' +
      (user.note ? '<div style="grid-column:1/-1"><span>Заметка</span><b>' + esc(user.note) + '</b></div>' : '') +
    '</div>' +
    (userDeviceGroups.length ? '<div class="section"><div class="section-head"><i class="dot"></i>Устройства</div><div class="section-body">' +
      userDeviceGroups.map(function (group) {
        var device = group.latest;
        return '<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="font-size:12.5px">' + esc(device.name || device.hwid) + '</b>' +
          ' <span class="muted" style="font-size:11.5px">' + esc([device.os, device.app_version].filter(Boolean).join(' · ')) + ' · ' + esc(ago(device.last_seen)) + '</span></div>';
      }).join('') + '</div></div>' : '') +
    '<div class="actions">' +
      '<button class="btn small" data-uact="edit-user">Изменить</button>' +

// ------------------------------------------------------------------ charts
var CHART_COLORS = ['#ff5c61', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#f472b6', '#38bdf8', '#facc15'];

function dayBuckets(items, field, days) {
  var result = [];
  var index = {};
  var start = new Date();
  start.setHours(0, 0, 0, 0);
  start = start.getTime() - (days - 1) * 86400000;
  for (var i = 0; i < days; i++) {
    var date = new Date(start + i * 86400000);
    var key = date.getFullYear() + '-' + date.getMonth() + '-' + date.getDate();
    var bucket = { date: date, count: 0 };
    index[key] = bucket;
    result.push(bucket);
  }
  (items || []).forEach(function (item) {
    var date = new Date(item[field]);
    if (isNaN(date.getTime())) return;
    var key = date.getFullYear() + '-' + date.getMonth() + '-' + date.getDate();
    if (index[key]) index[key].count++;
  });
  return result;
}

function niceStep(peak) {
  var raw = Math.max(1, peak) / 4;
  var power = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var normalized = raw / power;
  var step = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
  return Math.max(1, step * power);
}

function chartAxis(buckets) {
  var peak = buckets.reduce(function (max, bucket) { return Math.max(max, bucket.count); }, 0);
  if (peak <= 4) return { step: 1, max: peak >= 4 ? 4 : Math.max(2, peak + 1) };
  var step = niceStep(peak);
  return { step: step, max: step * Math.ceil(peak / step) };
}

function axisValues(axis) {
  var values = [];
  for (var value = 0; value <= axis.max + 0.0001; value += axis.step) values.push(value);
  return values;
}

function chartGrid(values, max, width, height, padding) {
  var plotH = height - padding.top - padding.bottom;
  var html = '';
  values.forEach(function (value) {
    var y = padding.top + plotH * (1 - value / max);
    html += '<line x1="' + padding.left + '" y1="' + y + '" x2="' + (width - padding.right) + '" y2="' + y +
      '" stroke="#2a2a33" stroke-width="1"' + (value ? ' stroke-dasharray="3 4"' : '') + '/>' +
      '<text x="' + (padding.left - 7) + '" y="' + (y + 3.5) + '" fill="#6f6f7a" font-size="9.5" text-anchor="end">' + value + '</text>';
  });
  return html;
}

function chartDateLabels(buckets, x, height) {
  var every = buckets.length > 10 ? 3 : 2;
  return buckets.map(function (bucket, index) {
    if (index % every !== 0 && index !== buckets.length - 1) return '';
    var text = String(bucket.date.getDate()).padStart(2, '0') + '.' + String(bucket.date.getMonth() + 1).padStart(2, '0');
    return '<text x="' + x(index) + '" y="' + (height - 7) + '" fill="#6f6f7a" font-size="9.5" text-anchor="middle">' + text + '</text>';
  }).join('');
}

var chartSeq = 0;

function lineChart(items, field, days, color, label) {
  var buckets = dayBuckets(items, field, days);
  var axis = chartAxis(buckets);
  var width = 720, height = 220;
  var padding = { top: 12, right: 10, bottom: 26, left: 34 };
  var plotW = width - padding.left - padding.right;
  var plotH = height - padding.top - padding.bottom;
  function x(index) { return padding.left + (days === 1 ? plotW / 2 : plotW * index / (days - 1)); }
  function y(value) { return padding.top + plotH * (1 - value / axis.max); }
  var points = buckets.map(function (bucket, index) { return x(index) + ',' + y(bucket.count); });
  var linePath = 'M' + points.join(' L');
  var areaPath = linePath + ' L' + x(days - 1) + ',' + y(0) + ' L' + x(0) + ',' + y(0) + ' Z';
  var gridValues = axisValues(axis);
  var gradient = 'chart-grad-' + (++chartSeq);
  var last = buckets[buckets.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' + esc(label) + '">' +
    '<defs><linearGradient id="' + gradient + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + color + '" stop-opacity=".3"/>' +
    '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    chartGrid(gridValues, axis.max, width, height, padding) +
    '<path d="' + areaPath + '" fill="url(#' + gradient + ')"/>' +
    '<path d="' + linePath + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(buckets.length - 1) + '" cy="' + y(last.count) + '" r="3.2" fill="' + color + '"/>' +
    chartDateLabels(buckets, x, height) +
    '</svg>';
}

function barChart(items, field, days, color, label) {
  var buckets = dayBuckets(items, field, days);
  var axis = chartAxis(buckets);
  var width = 720, height = 220;
  var padding = { top: 12, right: 10, bottom: 26, left: 34 };
  var plotW = width - padding.left - padding.right;
  var plotH = height - padding.top - padding.bottom;
  function x(index) { return padding.left + plotW * (index + 0.5) / days; }
  function y(value) { return padding.top + plotH * (1 - value / axis.max); }
  var slot = plotW / days;
  var barW = Math.max(5, slot * 0.52);
  var gridValues = axisValues(axis);
  var bars = buckets.map(function (bucket, index) {
    var top = y(bucket.count);
    var barHeight = Math.max(0, y(0) - top);
    if (barHeight < 1) return '';
    return '<rect x="' + (x(index) - barW / 2) + '" y="' + top + '" width="' + barW + '" height="' + barHeight +
      '" rx="3" fill="' + color + '" opacity="' + (index === days - 1 ? '1' : '.72') + '">' +
      '<title>' + esc(bucket.date.toLocaleDateString('ru-RU')) + ': ' + bucket.count + '</title></rect>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' + esc(label) + '">' +
    chartGrid(gridValues, axis.max, width, height, padding) + bars + chartDateLabels(buckets, x, height) + '</svg>';
}

function donutChart(rows, centerValue, centerLabel) {
  rows = rows.filter(function (row) { return Number(row.count) > 0; });
  var total = rows.reduce(function (sum, row) { return sum + Number(row.count); }, 0);
  var radius = 52, stroke = 15, circumference = 2 * Math.PI * radius;
  var ring = '<circle cx="70" cy="70" r="' + radius + '" fill="none" stroke="#22222b" stroke-width="' + stroke + '"/>';
  var offset = 0;
  var segments = rows.map(function (row) {
    var shown = row.display != null ? String(row.display) : Number(row.count).toLocaleString('ru-RU');
    var length = total ? Number(row.count) / total * circumference : 0;
    if (length <= 0) return '';
    var draw = Math.max(0.8, length - (length > 5 ? 1.6 : 0));
    var segment = '<circle cx="70" cy="70" r="' + radius + '" fill="none" stroke="' + row.color +
      '" stroke-width="' + stroke + '" stroke-dasharray="' + draw + ' ' + (circumference - draw) +
      '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 70 70)">' +
      '<title>' + esc(row.key) + ': ' + esc(shown) + '</title></circle>';
    offset += length;
    return segment;
  }).join('');
  var valueSize = String(centerValue).length > 9 ? 14 : String(centerValue).length > 6 ? 17 : 21;
  var legend = rows.map(function (row) {
    var shown = row.display != null ? String(row.display) : Number(row.count).toLocaleString('ru-RU');
    var percent = total ? Math.round(Number(row.count) / total * 100) : 0;
    return '<div class="donut-item"><i style="background:' + row.color + '"></i><span title="' + esc(row.key) + '">' + esc(row.key) +
      '</span><b>' + esc(shown) + '</b><em>' + percent + '%</em></div>';
  }).join('');
  return '<div class="donut-block"><div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="' + esc(centerLabel) + '">' +
    ring + segments +
    '<text x="70" y="67" fill="#f5f5f7" font-size="' + valueSize + '" font-weight="700" text-anchor="middle">' + esc(centerValue) + '</text>' +
    '<text x="70" y="83" fill="#6f6f7a" font-size="8.5" letter-spacing=".08em" text-anchor="middle">' + esc(centerLabel) + '</text>' +
    '</svg></div><div class="donut-legend">' + (legend || '<div class="hint" style="margin:0">Нет данных.</div>') + '</div></div>';
}

function userStatusRows(users, now) {
  var blocked = 0, expired = 0, expiring = 0;
  users.forEach(function (user) {
    if (user.status === 'blocked') { blocked++; return; }
    var time = expiresAt(user);
    if (time && time < now) { expired++; return; }
    if (time && time - now <= 7 * 86400000) { expiring++; return; }
  });
  return [
    { key: 'Активные', count: users.length - blocked - expired - expiring, color: CHART_COLORS[2] },
    { key: 'Истекают за 7 дней', count: expiring, color: CHART_COLORS[3] },
    { key: 'Истекли', count: expired, color: CHART_COLORS[0] },
    { key: 'Заблокированы', count: blocked, color: '#8b8b96' }
  ];
}

function platformRows(devices) {
  return countBy(devices, function (device) { return device.os || device.platform || 'неизвестно'; })
    .slice(0, 6)
    .map(function (row, index) { return { key: row.key, count: row.count, color: CHART_COLORS[index % CHART_COLORS.length] }; });
}

function renderHome() {
  var now = Date.now();
  var activeDevices = state.devices.filter(function (d) { return !d.archived; });
  var devices = dedupedDevices(activeDevices);
  var archived = state.devices.length - activeDevices.length;
  var onlineDevices = devices.filter(online);
  var vpnDevices = devices.filter(deviceVpnOn);
  var users = state.users;
  var blocked = users.filter(function (u) { return u.status === 'blocked'; });
  var expired = users.filter(function (u) { var t = expiresAt(u); return t && t < now; });
  var expiring = users.filter(function (u) { var t = expiresAt(u); return t && t >= now && t - now <= 7 * 86400000; });
  var withSubs = users.filter(function (u) {
    return u.subscription && Array.isArray(u.subscription.providerIds) && u.subscription.providerIds.length;
  });
  var providerCount = state.subscriptions.length;
  var reports = 0, healthy = 0, failing = 0, expiredReports = 0, nodes = 0;
  var failedProviders = [];
  devices.forEach(function (device) {
    var sub = deviceSubscription(device);
    if (!sub || !Array.isArray(sub.providers)) return;
    sub.providers.forEach(function (provider) {
      reports++;
      nodes += Number(provider.nodes) || 0;
      if (providerExpired(provider)) {
        expiredReports++;
      } else if (providerFailed(provider)) {
        failing++;
        failedProviders.push({ device: device, provider: provider });
      } else healthy++;
    });
  });
  var pendingCommands = state.commands.filter(function (c) { return c.status === 'pending'; }).length;
  var errorCommands = state.commands.filter(function (c) { return c.status === 'error' || c.status === 'failed'; }).length;
  var newFeedback = state.feedback.filter(function (f) { return f.status === 'new'; }).length;
  var eventsDay = state.events.filter(function (e) { return e.created_at && now - new Date(e.created_at).getTime() < 86400000; }).length;
  var traffic = devices.reduce(function (acc, d) {
    acc.sessionUp += Number(d.session_up) || 0;
    acc.sessionDown += Number(d.session_down) || 0;
    acc.totalUp += Number(d.total_up) || 0;
    acc.totalDown += Number(d.total_down) || 0;
    return acc;
  }, { sessionUp: 0, sessionDown: 0, totalUp: 0, totalDown: 0 });
  var totalTraffic = traffic.totalUp + traffic.totalDown;
  var versionRows = countBy(devices, function (d) { return d.app_version || 'неизвестно'; });
  var osRows = countBy(devices, function (d) { return d.os || d.platform || 'неизвестно'; });

  var attention = expired.slice(0, 4).map(function (user) {
    return listRow('истёк', userLabel(user), (user.plan || 'без тарифа') + ' · ' + dateText(user.expires_at));
  }).join('');
  attention += expiring.slice(0, 4).map(function (user) {
    var days = Math.max(1, Math.ceil((expiresAt(user) - now) / 86400000));
    return listRow('через ' + days + ' дн', userLabel(user), (user.plan || 'без тарифа') + ' · до ' + dateText(user.expires_at));
  }).join('');
  attention += failedProviders.slice(0, 4).map(function (item) {
    return listRow('ошибка', (item.provider.name || item.provider.id || 'провайдер') + ' · ' + (item.device.name || item.device.hwid),
      item.provider.error || 'подписка не загрузилась');
  }).join('');

  var eventRows = state.events.slice(0, 8).map(function (event) {
    return listRow(ago(event.created_at), event.type || 'событие', [event.message, event.hwid].filter(Boolean).join(' · '));
  }).join('');

  var onlineRows = onlineDevices.slice(0, 6).map(function (device) {
    var owner = deviceOwner(device);
    return listRow(ago(device.last_seen), device.name || device.model || device.hwid,
      [owner ? owner.username : 'без аккаунта', device.app_version, device.node_name || device.server].filter(Boolean).join(' · '));
  }).join('');
  var newDevicesBuckets = dayBuckets(devices, 'first_seen', 14);
  var newDevicesTotal = newDevicesBuckets.reduce(function (sum, bucket) { return sum + bucket.count; }, 0);
  var eventsTotal = dayBuckets(state.events, 'created_at', 14).reduce(function (sum, bucket) { return sum + bucket.count; }, 0);

  return '<div class="home-grid">' +
    homePanel('Сводка', metrics([
      { value: num(users.length), label: 'пользователей', hint: (users.length - blocked.length) + ' не заблокировано' },
      { value: num(devices.length), label: 'устройств', hint: onlineDevices.length + ' онлайн' },
      { value: num(vpnDevices.length), label: 'VPN включён', hint: 'из ' + devices.length + ' устройств' },
      { value: num(providerCount), label: 'подписок в каталоге', hint: withSubs.length + ' пользователей с доступом' },
      { value: num(nodes), label: 'узлов', hint: 'по снимкам клиентов' },
      { value: num(newFeedback), label: 'новых обращений', hint: state.feedback.length + ' всего' },
      { value: num(eventsDay), label: 'событий за сутки', hint: state.events.length + ' всего' }
    ]), { wide: true, extra: '<span class="muted" style="font-weight:400;font-size:11px">обновлено ' + esc(state.loadedAt ? dateText(state.loadedAt) : '—') + '</span>' }) +
    homePanel('Динамика за 14 дней', '<div class="split-2">' +
      '<div><div class="chart-caption"><i style="background:#ff5c61"></i>События<b>' + num(eventsTotal) + '</b></div>' +
      lineChart(state.events, 'created_at', 14, '#ff5c61', 'События за 14 дней') + '</div>' +
      '<div><div class="chart-caption"><i style="background:#60a5fa"></i>Новые устройства<b>' + num(newDevicesTotal) + '</b></div>' +
      barChart(devices, 'first_seen', 14, '#60a5fa', 'Новые устройства за 14 дней') + '</div>' +
      '</div>', { wide: true }) +
    homePanel('Структура', '<div class="charts-grid">' +
      donutChart(userStatusRows(users, now), num(users.length), 'ПОЛЬЗОВАТЕЛИ') +
      donutChart(platformRows(devices), num(devices.length), 'УСТРОЙСТВА') +
      donutChart([
        { key: 'Скачано', count: traffic.totalDown, display: bytes(traffic.totalDown), color: CHART_COLORS[1] },
        { key: 'Отправлено', count: traffic.totalUp, display: bytes(traffic.totalUp), color: CHART_COLORS[4] }
      ], bytes(totalTraffic), 'ТРАФИК') +
      donutChart([
        { key: 'Успешные', count: healthy, color: CHART_COLORS[2] },
        { key: 'С ошибкой', count: failing, color: CHART_COLORS[0] },
        { key: 'Истекли', count: expiredReports, color: CHART_COLORS[3] }
      ].filter(function (row) { return row.count > 0; }), num(reports), 'ПРОВЕРОК') +
      '</div>', { wide: true }) +
    homePanel('Пользователи', metrics([
      { value: num(users.filter(function (u) { return u.status !== 'blocked' && !(expiresAt(u) && expiresAt(u) < now); }).length), label: 'активных', cls: 'green' },
      { value: num(blocked.length), label: 'заблокировано', cls: blocked.length ? 'red' : '' },
      { value: num(expired.length), label: 'истекло', cls: expired.length ? 'amber' : '' },
      { value: num(expiring.length), label: 'истекает за 7 дней', cls: expiring.length ? 'amber' : '' },
      { value: num(withSubs.length), label: 'с подпиской' }
    ])) +
    homePanel('Устройства', metrics([
      { value: num(onlineDevices.length), label: 'онлайн', cls: 'green' },
      { value: num(devices.length - onlineDevices.length), label: 'офлайн' },
      { value: num(vpnDevices.length), label: 'VPN включён' },
      { value: num(devices.length - vpnDevices.length), label: 'VPN выключен' },
      { value: num(archived), label: 'в архиве' }
    ])) +
    homePanel('Трафик', metrics([
      { value: bytes(traffic.sessionUp), label: 'сессия ↑' },
      { value: bytes(traffic.sessionDown), label: 'сессия ↓' },
      { value: bytes(traffic.totalUp), label: 'всего ↑' },
      { value: bytes(traffic.totalDown), label: 'всего ↓' },
      { value: bytes(devices.length ? totalTraffic / devices.length : 0), label: 'в среднем на устройство' }
    ])) +
    homePanel('Провайдеры и подписки', metrics([
      { value: num(state.subscriptions.length), label: 'в каталоге' },
      { value: num(reports), label: 'проверок с устройств', cls: '' },
      { value: num(healthy), label: 'успешных', cls: 'green' },
      { value: num(failing), label: 'с ошибкой', cls: failing ? 'red' : '' },
      { value: num(expiredReports), label: 'истекли', cls: expiredReports ? 'amber' : '' },
      { value: num(nodes), label: 'узлов всего' },
      { value: num(withSubs.length), label: 'пользователей с доступом' }
    ])) +
    homePanel('Обращения и команды', metrics([
      { value: num(newFeedback), label: 'новых обращений', cls: newFeedback ? 'amber' : '' },
      { value: num(state.feedback.length), label: 'обращений всего' },
      { value: num(pendingCommands), label: 'команд в очереди', cls: pendingCommands ? 'amber' : '' },
      { value: num(errorCommands), label: 'команд с ошибкой', cls: errorCommands ? 'red' : '' },
      { value: num(eventsDay), label: 'событий за сутки' }
    ])) +
    homePanel('Версии и платформы', '<div class="split-2">' +
      '<div><div class="hint" style="margin:0 0 8px">Версии приложения</div>' + bars(versionRows, devices.length) + '</div>' +
      '<div><div class="hint" style="margin:0 0 8px">Платформы</div>' + bars(osRows, devices.length) + '</div>' +
      '</div>', { wide: true }) +
    homePanel('Требуют внимания', attention || '<div class="hint">Проблем не найдено.</div>') +
    homePanel('Онлайн-устройства', onlineRows || '<div class="hint">Сейчас нет устройств онлайн.</div>') +
    homePanel('Последние события', eventRows || '<div class="hint">Событий пока нет.</div>', { wide: true }) +
  '</div>';
}

// ------------------------------------------------------------------ subscriptions
function subscriptionUserList(item) {
  return state.users.filter(function (user) {
    var sub = user.subscription && typeof user.subscription === 'object' ? user.subscription : {};
    return Array.isArray(sub.providerIds) && sub.providerIds.indexOf(item.id) >= 0;
  });
}

function subscriptionSnapshots(item) {
  var result = [];
  state.devices.forEach(function (device) {
    if (device.archived) return;
    var snap = deviceSubscription(device);
    if (!snap || !Array.isArray(snap.providers)) return;
    var found = snap.providers.filter(function (provider) { return provider.id === item.id; })[0] || null;
    if (!found) return;
    result.push({ device: device, snapshot: snap, provider: found });
  });
  var groups = {};
  result.forEach(function (entry) {
    var key = deviceGroupKey(entry.device);
    if (!groups[key]) groups[key] = { items: [], stamp: 0, entry: null };
    groups[key].items.push(entry);
    var stamp = new Date((entry.snapshot && entry.snapshot.syncedAt) || entry.device.last_seen || 0).getTime();
    if (!groups[key].entry || stamp >= groups[key].stamp) {
      groups[key].stamp = stamp;
      groups[key].entry = entry;
    }
  });
  return Object.keys(groups).map(function (key) {
    return groups[key].entry;
  });
}

function subscriptionExpired(item) {
  var expire = Number(item && item.traffic && item.traffic.expire) || 0;
  if (!expire) return false;
  var at = expire > 1e12 ? expire : expire * 1000;
  return at <= Date.now();
}

function expireText(traffic) {
  var expire = Number(traffic && traffic.expire) || 0;
  if (!expire) return 'без ограничения';
  var at = expire > 1e12 ? expire : expire * 1000;
  var text = new Date(at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
  return at <= Date.now() ? text + ' · истёк' : text;
}

function nodeListHtml(nodes, limit) {
  var list = Array.isArray(nodes) ? nodes.slice(0, limit || 300) : [];
  if (!list.length) return '<div class="hint" style="margin:6px 0 0">Список серверов пока не загружен.</div>';
  var html = '<div class="node-list">' + list.map(function (node) {
    return '<div class="node-row"><b title="' + esc(node.name || node.server) + '">' + esc(node.name || node.server) +
      '</b><span>' + esc((node.protocol ? node.protocol + ' · ' : '') + node.server + ':' + node.port) + '</span></div>';
  }).join('') + '</div>';
  if (Array.isArray(nodes) && nodes.length > list.length) {
    html += '<div class="node-more">… ещё ' + esc(nodes.length - list.length) + ' серверов</div>';
  }
  return html;
}

function subscriptionPreviewHtml(preview, limit) {
  if (!preview) return '';
  var nodes = Array.isArray(preview.nodes) ? preview.nodes : [];
  var total = Number(preview.nodesTotal) || nodes.length;
  var traffic = preview.traffic || null;
  var meta = [];
  if (total) meta.push('серверов: ' + num(total));
  if (traffic) {
    meta.push('трафик: ' + bytes((Number(traffic.upload) || 0) + (Number(traffic.download) || 0)) +
      (Number(traffic.total) ? ' из ' + bytes(traffic.total) : ''));
    meta.push('до ' + expireText(traffic));
  }
  return '<div class="sub-preview">' +
    '<div class="sub-preview-head"><b>' + esc(preview.name || 'Подписка') + '</b><span class="spacer"></span>' +
      (subscriptionExpired(preview) ? badge('истекла', 'red') : badge('загружена', 'green')) + '</div>' +
    (meta.length ? '<div class="sub-preview-meta"><span>' + meta.map(esc).join('</span><span>') + '</span></div>' : '') +
    nodeListHtml(nodes, limit || 30) +
    '</div>';
}

function renderSubscriptions() {
  var needle = state.search;
  var list = state.subscriptions.filter(function (item) {
    if (!needle) return true;
    return [item.id, item.name, item.url].join(' ').toLowerCase().indexOf(needle) >= 0;
  });

  var enabledCount = state.subscriptions.filter(function (item) { return item.enabled !== false; }).length;
  var assigned = 0;
  state.users.forEach(function (user) {
    var sub = user.subscription && typeof user.subscription === 'object' ? user.subscription : {};
    assigned += Array.isArray(sub.providerIds) ? sub.providerIds.length : 0;
  });
  var reports = 0, healthy = 0, failing = 0, expiredReports = 0, nodes = 0;
  state.subscriptions.forEach(function (item) {
    subscriptionSnapshots(item).forEach(function (snap) {
      reports++;
      nodes += Number(snap.provider.nodes) || 0;
      if (providerExpired(snap.provider)) expiredReports++;
      else if (providerFailed(snap.provider)) failing++;
      else healthy++;
    });
  });

  var summary = metrics([
    { value: num(state.subscriptions.length), label: 'в каталоге', hint: state.users.length + ' пользователей' },
    { value: num(enabledCount), label: 'включено', cls: enabledCount ? 'green' : '' },
    { value: num(assigned), label: 'выдано пользователям' },
    { value: num(reports), label: 'проверок с устройств' },
    { value: num(healthy), label: 'успешных', cls: healthy ? 'green' : '' },
    { value: num(failing), label: 'с ошибкой', cls: failing ? 'red' : '' },
    { value: num(expiredReports), label: 'истекли', cls: expiredReports ? 'amber' : '' },
    { value: num(nodes), label: 'узлов всего' }
  ]);

  var body = '<div class="panel" style="margin-bottom:14px"><div class="panel-head"><i class="dot"></i>Каталог подписок' +
    '<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:11px">ссылки видны только администратору</span>' +
    '<button class="btn primary small" data-sub-add type="button">+ Подписка</button></div>' + summary +
    '<div class="hint" style="margin:12px 16px 16px">Подписка добавляется один раз для всех. В карточке пользователя отмечается, какие подписки ему доступны.</div></div>';

  body += list.length
    ? '<div class="grid">' + list.map(subscriptionCard).join('') + '</div>'
    : '<div class="empty"><b>Подписок нет</b>Нажмите «+ Подписка», чтобы добавить ссылку в общий каталог.</div>';

  body += renderDeviceSubscriptions();
  return body;
}

function openAddSubscriptionModal(item) {
  var current = item || {};
  var initialPreview = Array.isArray(current.nodes) && current.nodes.length ? {
    name: current.name,
    nodes: current.nodes,
    nodesTotal: current.nodesTotal || current.nodes.length,
    traffic: current.traffic || null
  } : null;
  openModal(item ? 'Изменить подписку' : 'Новая подписка', '' +
    '<div class="field"><label>Ссылка подписки</label><input class="input" id="subUrl" placeholder="https://… или happ://…" autocomplete="off" value="' + esc(current.url || '') + '"></div>' +
    '<div class="hint" id="subPreviewHint" style="margin-top:8px">Название, срок действия и список серверов загрузятся автоматически.</div>' +
    '<div id="subPreview">' + (initialPreview ? subscriptionPreviewHtml(initialPreview, 20) : '') + '</div>' +
    '<label class="check" style="margin-top:10px"><input type="checkbox" id="subEnabled"' + (current.enabled !== false ? ' checked' : '') + '> Включена</label>' +
    '<div class="hint">Подписка сохраняется в общем каталоге и передаётся только тем пользователям, у которых она отмечена. В интерфейсе пользователя ссылки нет.</div>',
    async function () {
      var url = $('subUrl').value.trim();
      if (!url) { toast('Укажите ссылку подписки'); return false; }
      var preview = null;
      try {
        preview = JSON.parse($('subPreview').getAttribute('data-preview') || 'null');
      } catch (error) {
        preview = null;
      }
      var subscription = {
        id: current.id || '',
        url: url,
        enabled: $('subEnabled').checked
      };
      if (preview) {
        subscription.name = preview.name || '';
        subscription.nodes = preview.nodes || [];
        subscription.nodesTotal = preview.nodesTotal || (preview.nodes || []).length;
        subscription.traffic = preview.traffic || null;
        subscription.fetchedAt = preview.fetchedAt || Date.now();
      }
      var result = await panel('admin_save_subscription', { subscription: subscription });
      if (!result.ok) { toast(result.message || 'Ошибка'); return false; }
      toast(current.id ? 'Подписка обновлена' : 'Подписка добавлена');
      load();
      return true;
    });

  var input = $('subUrl');
  var previewBox = $('subPreview');
  var hint = $('subPreviewHint');
  var timer = null;
  var lastUrl = '';

  function setPreview(preview) {
    previewBox.setAttribute('data-preview', preview ? JSON.stringify(preview) : '');
    previewBox.innerHTML = preview ? subscriptionPreviewHtml(preview, 20) : '';
  }

  async function loadPreview() {
    var url = input.value.trim();
    if (!url) {
      setPreview(null);
      hint.textContent = 'Название, срок действия и список серверов загрузятся автоматически.';
      return;
    }
    if (url === lastUrl) return;
    lastUrl = url;
    hint.textContent = 'Загрузка подписки…';
    var result = await panel('admin_preview_subscription', { url: url });
    if (input.value.trim() !== url) return;
    if (!result.ok) {
      setPreview(null);
      hint.innerHTML = '<span style="color:#ffb4b6">Не удалось загрузить: ' + esc(result.message || 'ошибка') + '</span>';
      return;
    }
    var preview = result.data.preview;
    setPreview(preview);
    hint.textContent = 'Название и список серверов загружены. Их можно проверить перед сохранением.';
  }

  function schedulePreview() {
    if (timer) clearTimeout(timer);
    if (input.value.trim() !== lastUrl) {
      setPreview(null);
      lastUrl = '';
    }
    timer = setTimeout(loadPreview, 700);
  }

  input.addEventListener('input', schedulePreview);
  input.addEventListener('blur', function () { if (timer) clearTimeout(timer); loadPreview(); });
  if (initialPreview && current.url) {
    previewBox.setAttribute('data-preview', JSON.stringify(initialPreview));
    lastUrl = current.url;
  }
  if (!current.url) setTimeout(function () { input.focus(); }, 60);
}

function openDeleteSubscriptionModal(item) {
  var users = subscriptionUserList(item);
  openModal('Удалить подписку', '' +
    '<div class="hint">Подписка <b>' + esc(item.name) + '</b> будет удалена из каталога' +
    (users.length ? ' и снята с пользователей: ' + esc(users.map(function (user) { return user.username; }).join(', ')) : '') +
    '.</div>',
    async function () {
      var result = await panel('admin_delete_subscription', { id: item.id });
      if (!result.ok) { toast(result.message || 'Ошибка'); return false; }
      toast('Подписка удалена');
      load();
      return true;
    });
}

$('view').addEventListener('click', function (event) {
  var add = event.target.closest('[data-sub-add]');
  if (add) { openAddSubscriptionModal(null); return; }
  var edit = event.target.closest('[data-sub-edit]');
  if (edit) {
    var editItem = state.subscriptions.find(function (item) { return item.id === edit.dataset.subEdit; });
    if (editItem) openAddSubscriptionModal(editItem);
    return;
  }
  var del = event.target.closest('[data-sub-delete]');
  if (del) {
    var delItem = state.subscriptions.find(function (item) { return item.id === del.dataset.subDelete; });
    if (delItem) openDeleteSubscriptionModal(delItem);
  }
});

function subscriptionCard(item) {
  var users = subscriptionUserList(item);
  var snapshots = subscriptionSnapshots(item);
  var failed = snapshots.filter(function (snap) { return providerFailed(snap.provider); }).length;
  var liveNodes = snapshots.reduce(function (sum, snap) { return sum + (Number(snap.provider.nodes) || 0); }, 0);
  var previewNodes = Array.isArray(item.nodes) ? item.nodes : [];
  var catalogNodes = Number(item.nodesTotal) || previewNodes.length;
  var nodes = catalogNodes || liveNodes;
  var expired = subscriptionExpired(item);
  var cabinetUrl = /^https?:\/\//i.test(String(item.resolvedUrl || ''))
    ? String(item.resolvedUrl).trim()
    : (/^https?:\/\//i.test(String(item.url || '')) ? String(item.url).trim() : '');
  var synced = '';
  var selected = '';
  snapshots.forEach(function (snap) {
    var stamp = snap.snapshot.syncedAt;
    if (stamp && (!synced || new Date(stamp).getTime() > new Date(synced).getTime())) synced = stamp;
    if (!selected && snap.snapshot.selected) selected = snap.snapshot.selected;
  });

  var deviceHtml = snapshots.map(function (snap) {
    var owner = deviceOwner(snap.device);
    var snapExpired = expired || providerExpired(snap.provider);
    var title = '<div class="grow"><b>' + esc(snap.device.name || snap.device.model || snap.device.hwid) + '</b>' +
      '<small>' + esc([owner ? owner.username : 'без аккаунта', snap.device.os, snap.device.app_version].filter(Boolean).join(' · ')) + '</small></div>';
    return '<div class="sub-device">' + title +
      (snapExpired ? badge('истекла', 'red') : (snap.provider.ok === false ? badge('ошибка', 'red') : badge('работает', 'green'))) +
      '<span class="muted">' + esc(snap.provider.nodes != null ? snap.provider.nodes + ' узлов' : '—') + '</span>' +
      (!snapExpired && snap.provider.error ? '<span style="color:#ffb4b6;font-size:10.5px;width:100%">' + esc(snap.provider.error) + '</span>' : '') +
      (snapExpired ? '<span class="muted" style="font-size:10.5px;width:100%">Подписка истекла — клиент больше не получает её серверы, старые ошибки загрузки не учитываются.</span>' : '') +
      providerCabinetLink(snap.provider) +
      '</div>';
  }).join('');

  var raw = {
    subscription: item,
    users: users.map(function (user) { return { id: user.id, username: user.username }; }),
    devices: snapshots.map(function (snap) {
      return {
        device: snap.device.name || snap.device.hwid,
        provider: snap.provider,
        syncedAt: snap.snapshot.syncedAt,
        selected: snap.snapshot.selected,
        errors: snap.snapshot.errors
      };
    })
  };

  return '<article class="card">' +
    '<div class="card-head"><div style="min-width:0;flex:1">' +
      '<div class="card-title">' + esc(item.name || 'Без названия') + '</div>' +
      '<div class="card-sub mono">' + esc(item.id) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">' +
        (expired ? badge('истекла', 'red') : (item.enabled === false ? badge('выключена', '') : badge('включена', 'green'))) +
        (failed ? badge(failed + ' с ошибкой', 'red') : '') +
      '</div></div>' +
    '<div class="kv">' +
      '<div><span>Пользователей</span><b>' + esc(users.length ? users.map(function (user) { return user.username; }).join(', ') : 'никому не выдана') + '</b></div>' +
      '<div><span>Устройств с данными</span><b>' + esc(snapshots.length) + '</b></div>' +
      '<div><span>Узлов</span><b>' + esc(num(nodes)) + '</b></div>' +
      '<div><span>Срок действия</span><b>' + esc(item.traffic ? expireText(item.traffic) : 'неизвестно') + '</b></div>' +
      '<div><span>Проверка</span><b>' + esc(expired ? 'не проверяется' : (failed ? failed + ' с ошибкой' : (snapshots.length ? 'все успешно' : 'нет данных'))) + '</b></div>' +
      '<div><span>Синхронизация</span><b>' + esc(synced ? dateText(synced) : '—') + '</b></div>' +
      '<div><span>Добавлена</span><b>' + esc(dateText(item.createdAt)) + '</b></div>' +
      (selected ? '<div style="grid-column:1/-1"><span>Выбранный узел</span><b>' + esc(selected) + '</b></div>' : '') +
      '<div style="grid-column:1/-1"><span>Ссылка провайдера</span><b class="sub-url" title="' + esc(cabinetUrl || item.url || '') + '">' +
        (cabinetUrl ? '<a href="' + esc(cabinetUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(cabinetUrl) + '</a>' : '—') + '</b></div>' +
    '</div>' +
    (expired
      ? '<div class="hint" style="color:#fbbf24;margin-top:8px">Подписка истекла — серверы больше не передаются клиентам.</div>'
      : (item.fetchError ? '<div class="hint" style="color:#ffb4b6;margin-top:8px">Не удалось обновить данные: ' + esc(item.fetchError) + '</div>' : '')) +
    (previewNodes.length
      ? '<details class="sub-preview"' + (snapshots.length && !expired ? '' : ' open') + '><summary>Серверы подписки (' + esc(num(catalogNodes)) + ')</summary>' + nodeListHtml(previewNodes, 300) + '</details>'
      : '') +
    (deviceHtml ? '<div class="sub-devices">' + deviceHtml + '</div>' : '<div class="hint">Устройства ещё не присылали снимок этой подписки.</div>') +
    '<div class="actions">' +
      (cabinetUrl ? '<a class="btn small ghost" href="' + esc(cabinetUrl) + '" target="_blank" rel="noopener noreferrer">Открыть у провайдера</a>' : '') +
      '<button class="btn small" data-sub-edit="' + esc(item.id) + '">Изменить</button>' +
      '<button class="btn small danger ghost" data-sub-delete="' + esc(item.id) + '">Удалить</button>' +
    '</div>' +
    '<details><summary>JSON подписки и устройств</summary><pre>' + esc(JSON.stringify(raw, null, 2)) + '</pre></details>' +
  '</article>';
}

function renderDeviceSubscriptions() {
  var groups = deviceGroups(state.devices.filter(function (d) { return !!deviceSubscription(d); }));
  var needle = state.search;
  if (needle) {
    groups = groups.filter(function (group) {
      return group.items.some(function (device) {
        var owner = deviceOwner(device);
        var sub = deviceSubscription(device);
        var providers = Array.isArray(sub.providers) ? sub.providers : [];
        return [device.name, device.hwid, owner && owner.username, providers.map(function (p) { return [p.id, p.name].join(' '); }).join(' ')]
          .join(' ').toLowerCase().indexOf(needle) >= 0;
      });
    });
  }
  if (!groups.length) return '';
  return '<div class="panel-head" style="margin:22px 0 10px"><i class="dot"></i>Снимки с устройств' +
    '<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:11px">что клиенты реально получили от провайдеров</span></div>' +
    '<div class="grid">' + groups.map(function (group) {
      return deviceSubscriptionCard(group.latest);
    }).join('') + '</div>';
}

function deviceSubscriptionCard(device) {
  var sub = deviceSubscription(device);
  var owner = deviceOwner(device);
  var providers = Array.isArray(sub.providers) ? sub.providers : [];
  var expiredCount = providers.filter(providerExpired).length;
  var updated = sub.updatedAt || device.config_view_at;
  var rows = providers.map(function (provider) {
    var isExpired = providerExpired(provider);
    return '<div class="provider">' + badge(provider.name || provider.id || 'провайдер', isExpired ? '' : (provider.ok === false ? 'red' : 'green')) +
      '<span class="muted" style="font-size:11.5px;flex:1">' + esc(provider.id || '') +
      (isExpired ? ' · подписка истекла' : (provider.nodes != null ? ' · ' + provider.nodes + ' узлов' : '')) +
      (!isExpired && provider.error ? ' · ' + esc(provider.error) : '') + '</span>' + providerCabinetLink(provider) + '</div>';
  }).join('');
  return '<article class="card' + (online(device) ? '' : ' offline') + '">' +
    '<div class="card-head"><div style="min-width:0;flex:1">' +
      '<div class="card-title">' + esc(device.name || device.model || device.hwid) + '</div>' +
      '<div class="card-sub">' + esc(owner ? owner.username : 'без аккаунта') + ' · ' + esc(device.hwid) + '</div></div>' +
      (online(device) ? badge('онлайн', 'green') : badge('офлайн', '')) +
    '</div>' +
    '<div class="kv">' +
      '<div><span>Провайдеров</span><b>' + esc(providers.length) + (expiredCount ? ' (' + expiredCount + ' истекли)' : '') + '</b></div>' +
      '<div><span>Узлов</span><b>' + esc(num(sub.nodesTotal != null ? sub.nodesTotal : 0)) + '</b></div>' +
      '<div><span>Выбранный узел</span><b>' + esc(sub.selected || sub.nodeName || '—') + '</b></div>' +
      '<div><span>Синхронизация</span><b>' + esc(updated ? dateText(updated) : '—') + '</b></div>' +
    '</div>' +
    (rows ? '<div style="margin-top:12px">' + rows + '</div>' : '<div class="hint">Провайдеров в снимке нет.</div>') +
    (Array.isArray(sub.errors) && sub.errors.length ? '<div class="hint" style="color:#ffb4b6">' + sub.errors.map(esc).join('<br>') + '</div>' : '') +
    '<details><summary>Сырой JSON подписки</summary><pre>' + esc(JSON.stringify(sub, null, 2)) + '</pre></details>' +
  '</article>';
}

// ------------------------------------------------------------------ modal
function openModal(title, body, onSubmit) {
  var root = $('modalRoot');
  root.innerHTML = '<div class="modal-back"><form class="modal" id="modalForm"><h2>' + esc(title) + '</h2>' +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-actions"><button class="btn ghost" type="button" id="modalCancel">Отмена</button>' +
    '<button class="btn primary" type="submit" id="modalSubmit">Сохранить</button></div></form></div>';
  function close() { root.innerHTML = ''; }
  $('modalCancel').addEventListener('click', close);
  root.querySelector('.modal-back').addEventListener('click', function (event) { if (event.target === this) close(); });
  $('modalForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    var button = $('modalSubmit');
    button.disabled = true;
    button.textContent = 'Сохранение…';
    var ok = await onSubmit();
    button.disabled = false;
    button.textContent = 'Сохранить';
    if (ok) close();
  });
  setTimeout(function () {
    var first = root.querySelector('input,textarea,select');
    if (first) first.focus();
  }, 50);
}

// ------------------------------------------------------------------ pwa
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}

init();
</script>
